name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/remote-control-security.js
          node --check src/remote-control-tls.js
          node --check src/remote-control-server.js
          node --check src/remote-controller.js
          node --check src/renderer.js
          node --check src/comment-normalizer.js
          node --check src/ndgr-security.js
          node --check src/comment-recorder.js
          node --check src/video-queue.js
          node --check src/poll-engine.js
          node --check src/enquete-api.js
          node --check src/program-api.js
          node --check src/extension-api.js
          node --check src/quotation-api.js
          node --check src/playback-scheduler.js
          node --check src/quote-scheduler.js
          node --check src/broadcast-management.js
          node --check src/next-frame-monitor.js
          node --check src/inherited-program.js
          node --check src/program-control.js
          node --check src/registered-user-monitor.js
          node --check src/own-broadcast-monitor.js
          node --check src/ranking-monitor.js
          node --check src/earthquake-notice.js
          node --check src/live-page-zoom.js
          node --check src/update-channel.js
          node --check src/release-history.js
          node --check src/bundled-changelog.js
          node --check src/manual-program-create.js
          node --check src/video-metadata.js
          node --check src/quote-timing-safety.js
          node --check src/auto-poll-policy.js
          node --check scripts/release-notes.js
          node --check scripts/generate-update-manifest.js
          node --check scripts/prepare-update-config.js
          node --check src/live-view-layout.js
          node --check src/comment-view-settings.js
      - name: Run unit tests
        run: npm test
