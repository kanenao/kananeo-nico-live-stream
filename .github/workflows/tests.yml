name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/remote-control-security.js
          node --check src/remote-control-server.js
          node --check src/remote-controller.js
          node --check src/renderer.js
          node --check src/comment-normalizer.js
          node --check src/ndgr-security.js
          node --check src/comment-recorder.js
          node --check src/video-queue.js
          node --check src/poll-engine.js
          node --check src/enquete-api.js
          node --check src/program-api.js
          node --check src/extension-api.js
          node --check src/quotation-api.js
          node --check src/playback-scheduler.js
          node --check src/quote-scheduler.js
          node --check src/broadcast-management.js
          node --check src/live-view-layout.js
          node --check src/comment-view-settings.js
      - name: Run unit tests
        run: npm test
