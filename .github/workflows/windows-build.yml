name: Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "CHANGELOG.md"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/windows-build.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "package.json"
      - "CHANGELOG.md"
      - "src/**"
      - "test/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected = process.env.RELEASE_TAG.slice(1); const actual = require('./package.json').version; if (expected !== actual) { console.error('Tag version does not match package.json: ' + expected + ' !== ' + actual); process.exit(1); }"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Generate update manifests for current release channel
        run: node scripts/generate-update-manifest.js

      - name: Verify embedded update configuration
        shell: pwsh
        run: |
          if (!(Test-Path "dist/win-unpacked/resources/app-update.yml")) { throw "Missing app-update.yml" }
          $channels = node -p "require('./src/update-channel').channelsForVersion(require('./package.json').version).join(',')"
          if (!$channels) { throw "Unsupported release channel" }
          foreach ($channel in $channels.Split(',')) {
            if (!(Test-Path "dist/$channel.yml")) { throw "Missing $channel.yml" }
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: kananeo-nico-live-stream-windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: kananeo-nico-live-stream-windows-${{ github.ref_name }}
          path: dist

      - name: Publish GitHub Release (alpha, beta or stable)
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const { releaseBodyForVersion } = require(path.join(process.cwd(), "scripts", "release-notes.js"));
            const releaseBody = releaseBodyForVersion(version, fs.readFileSync("CHANGELOG.md", "utf8"));
            const onMain = context.ref === "refs/heads/main";
            if (onMain && !/^\d+\.\d+\.\d+-alpha\.\d+$/.test(version)) {
              core.info("Skipping automatic release: only alpha builds are published from main.");
              return;
            }
            const tag = onMain ? `v${version}` : context.ref.slice("refs/tags/".length);
            if (!/^v\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?$/.test(tag) || tag.slice(1) !== version) {
              throw new Error("Release tag and package version do not match.");
            }
            // Do not publish an old build if main has advanced while this workflow was running.
            if (onMain) {
              const latest = await github.rest.repos.getBranch({owner, repo, branch:"main"});
              if (latest.data.commit.sha !== context.sha) {
                core.info("Skipping stale alpha build: main now points to a newer commit.");
                return;
              }
            }
            const files = fs.readdirSync("dist").filter(name => name.toLowerCase().endsWith(".exe") || /^(alpha|beta|latest)\.yml$/.test(name)).sort();
            const installer = files.some(name => /setup/i.test(name));
            const portable = files.some(name => /portable/i.test(name));
            const channel = version.includes("-alpha.") ? "alpha" : (version.includes("-beta.") || version.includes("-rc.")) ? "beta" : "latest";
            const manifests = channel === "latest" ? ["latest.yml", "beta.yml", "alpha.yml"] : channel === "beta" ? ["beta.yml", "alpha.yml"] : ["alpha.yml"];
            if (!installer || !portable || manifests.some(file => !files.includes(file))) {
              throw new Error("Setup, Portable and all subscribed-channel manifests are required.");
            }
            for (const manifest of manifests) {
              if (!fs.readFileSync(path.join("dist", manifest), "utf8").startsWith("version: " + version + "\n")) {
                throw new Error(manifest + " version mismatch.");
              }
            }

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              // Never overwrite a tag with binaries from a different commit.
              if (release.target_commitish !== context.sha) {
                throw new Error(`Release ${tag} already points to a different revision. Stop instead of overwriting it.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `kananeo nico live stream ${tag}`,
                body: releaseBody,
                generate_release_notes: true,
                draft: false,
                prerelease: tag.includes("-")
              });
              release = created.data;
            }

            for (const name of files) {
              const oldAsset = (release.assets || []).find(asset => asset.name === name);
              if (oldAsset) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: oldAsset.id });
              }
              const filePath = path.join("dist", name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length
                }
              });
              core.info(`Uploaded ${name}`);
            }
