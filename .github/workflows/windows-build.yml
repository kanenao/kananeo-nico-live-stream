name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "package.json"
      - "src/**"
      - "test/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const expected = process.env.RELEASE_TAG.slice(1); const actual = require('./package.json').version; if (expected !== actual) { console.error('Tag version does not match package.json: ' + expected + ' !== ' + actual); process.exit(1); }"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: kananeo-nico-live-stream-windows-${{ github.ref_name }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: kananeo-nico-live-stream-windows-${{ github.ref_name }}
          path: dist

      - name: Publish version-tagged GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const files = fs.readdirSync("dist").filter(name => name.toLowerCase().endsWith(".exe")).sort();
            if (!files.length) throw new Error("Windows installer files were not generated.");

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `kananeo nico live stream ${tag}`,
                generate_release_notes: true,
                draft: false,
                prerelease: tag.includes("-")
              });
              release = created.data;
            }

            for (const name of files) {
              const oldAsset = (release.assets || []).find(asset => asset.name === name);
              if (oldAsset) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: oldAsset.id });
              }
              const filePath = path.join("dist", name);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  "content-type": "application/octet-stream",
                  "content-length": data.length
                }
              });
              core.info(`Uploaded ${name}`);
            }
